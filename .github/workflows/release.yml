name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Released binaries are built with the newest toolchain, not with
          # the go directive's version. That directive is the minimum a
          # consumer needs to build the library, while the toolchain that
          # compiles these binaries is where security and performance fixes
          # actually live — building with 1.21 would ship without them.
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/liminalpurple/mdminify/cmd.version=${version}"

          GOOS=linux  GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/mdminify-linux-amd64" .
          GOOS=linux  GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/mdminify-linux-arm64" .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/mdminify-darwin-amd64" .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/mdminify-darwin-arm64" .
          GOOS=windows GOARCH=amd64 go build -ldflags "${ldflags}" -o "dist/mdminify-windows-amd64.exe" .
          GOOS=windows GOARCH=arm64 go build -ldflags "${ldflags}" -o "dist/mdminify-windows-arm64.exe" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
